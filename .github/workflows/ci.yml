name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  core-tests:
    name: BadwaterCore (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test
