name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  core-tests:
    name: BadwaterCore (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      # The committed conformance vectors must match the core they were
      # generated from. If this fails, a core change landed without
      # `swift run badwater-vectors --out conformance/vectors.json`.
      - name: Conformance vectors are fresh
        run: swift run badwater-vectors --check conformance/vectors.json

  # The SwiftUI app target had no CI at all until this job: `App/` was never
  # compiled and BadwaterIgnitionTests / BadwaterIgnitionUITests never ran, so a
  # break in the presentation layer (or in the `canImport(AppKit)` macOS branches,
  # which no one builds day to day) reached `main` unnoticed. This gate compiles
  # both destinations and runs both app test bundles.
  app-build:
    name: SwiftUI app (iOS + macOS build, app tests)
    # Pinned to macos-26 so CI compiles with the same Xcode 26 SDK development
    # runs on. On macos-15 this job accepted `ObsActivityController.swift`
    # unchanged while Xcode 26.6 rejected it with three
    # `sending '…' risks causing data races` errors — `Activity<Attributes>` is
    # not Sendable in the iOS 26 SDK. Green CI therefore said nothing about
    # whether the app built on a Mac, which is the one thing this job exists to
    # say. Bump this deliberately, together with the local toolchain.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # xcbeautify keeps xcodebuild's output readable in the Actions log; it is
      # installed explicitly rather than assumed present on the runner image.
      - name: Install XcodeGen + xcbeautify
        run: brew install xcodegen xcbeautify

      # BadwaterIgnition.xcodeproj is generated, not committed (see project.yml).
      - name: Generate Xcode project
        run: xcodegen generate

      # Pin to whatever iOS runtime the runner image actually ships rather than a
      # hardcoded device name, which silently rots as GitHub rolls Xcode forward.
      - name: Select an iOS simulator
        id: sim
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available --json \
            | jq -r '[.devices | to_entries[]
                      | select(.key | test("com.apple.CoreSimulator.SimRuntime.iOS"))
                      | .value[] | select(.isAvailable)][0].udid')
          if [ -z "$udid" ] || [ "$udid" = "null" ]; then
            echo "No available iOS simulator on this runner:" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "Using simulator $udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      # Build before test so a compile break reports as a build failure rather
      # than being buried in test-bundle output.
      - name: Build (iOS Simulator)
        run: |
          set -euo pipefail
          xcodebuild build \
            -project BadwaterIgnition.xcodeproj \
            -scheme BadwaterIgnition \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            | xcbeautify

      # The macOS destination is declared in project.yml but nothing builds it,
      # so the `#elseif canImport(AppKit)` pasteboard/keyboard branches in
      # WatchView have never been compiled. This step keeps them honest.
      - name: Build (macOS)
        run: |
          set -euo pipefail
          xcodebuild build \
            -project BadwaterIgnition.xcodeproj \
            -scheme BadwaterIgnition \
            -destination "platform=macOS,arch=arm64" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            | xcbeautify

      # The app build above compiles the embedded widget extension, but only for
      # as long as the embed wiring holds. Building the extension's own scheme
      # means a regression in that wiring fails loudly here instead of quietly
      # dropping the widget out of CI's coverage. Neither the widget nor the
      # watch can be meaningfully *tested* on a runner — but both must compile,
      # which is why this is wired as the target is created rather than at the
      # end. The canImport(AppKit) branches in WatchView rotted for months for
      # exactly the want of a step like this.
      - name: Build (widget extension)
        run: |
          set -euo pipefail
          xcodebuild build \
            -project BadwaterIgnition.xcodeproj \
            -scheme BadwaterWidget \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            | xcbeautify

      # The watch app needs its own scheme and a watchOS simulator: building the
      # iOS app scheme does not compile watch content for a simulator
      # destination, so without this step every watchOS source in the repo would
      # be compiled by nothing at all.
      - name: Build (watchOS app + complication)
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available --json \
            | jq -r '[.devices | to_entries[]
                      | select(.key | test("watchOS")) | .value[]
                      | select(.isAvailable)][0].udid')
          if [ -z "$udid" ] || [ "$udid" = "null" ]; then
            echo "No available watchOS simulator on this runner:" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          xcodebuild build \
            -project BadwaterIgnition.xcodeproj \
            -scheme BadwaterWatch \
            -destination "id=$udid" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            | xcbeautify

      - name: Unit tests (BadwaterIgnitionTests)
        run: |
          set -euo pipefail
          xcodebuild test \
            -project BadwaterIgnition.xcodeproj \
            -scheme BadwaterIgnition \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:BadwaterIgnitionTests \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            | xcbeautify

      - name: UI tests (BadwaterIgnitionUITests)
        run: |
          set -euo pipefail
          xcodebuild test \
            -project BadwaterIgnition.xcodeproj \
            -scheme BadwaterIgnition \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:BadwaterIgnitionUITests \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            | xcbeautify

  web-conformance:
    name: Web parity (engine.js vs BadwaterCore vectors)
    runs-on: ubuntu-latest
    env:
      TZ: UTC   # xlsx sheet names/titles are date-derived on both sides
    steps:
      - uses: actions/checkout@v4
      - name: Web sources parse
        run: node --check web/engine.js && node --check web/app.js
      - name: Conformance harness
        run: node conformance/check-web.js
