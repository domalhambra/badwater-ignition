# XcodeGen spec for the Badwater Ignition app.
# Regenerate the .xcodeproj with:  xcodegen generate   (XcodeGen 2.38+)
#
# The app target depends on the local BadwaterCore Swift package (Package.swift
# at the repo root), which holds all IRPG table data and calculation logic and
# is independently unit-tested on Linux CI.
name: BadwaterIgnition
options:
  bundleIdPrefix: com.badwater
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  BadwaterCore:
    path: .

targets:
  BadwaterIgnition:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App/BadwaterIgnition
    dependencies:
      - package: BadwaterCore
        product: BadwaterCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.badwater.ignition
        # PRODUCT_NAME deliberately has NO space and matches the target name.
        # It names the binary and the .app bundle, and XcodeGen derives the unit
        # test target's TEST_HOST from the *target* name — so a spaced
        # PRODUCT_NAME ("Badwater Ignition") pointed TEST_HOST at
        # BadwaterIgnition.app/BadwaterIgnition while the build actually produced
        # "Badwater Ignition.app/Badwater Ignition". BadwaterIgnitionTests could
        # never launch as a result. The user-visible home-screen name comes from
        # INFOPLIST_KEY_CFBundleDisplayName below, which is what it is for.
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Badwater Ignition
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        # Required for the one-shot site GPS fix (SiteLocationProvider). Without
        # this key the authorization request is ignored and the fix never
        # arrives. When-in-use only: the app takes a single fix on demand and
        # never tracks, so there is no "always" mode to justify.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: >-
          Fills the observation site's coordinate and elevation from a single GPS
          fix so they don't have to be typed on the line. The position stays on
          this device — it is only written to the observation log and the
          spreadsheets you export.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: PoolTeal
        # Swift 6 language mode: full data-race checking, matching
        # Package.swift's swiftLanguageMode(.v6) for BadwaterCore. The view
        # models and the SwiftUI views are @MainActor-isolated accordingly.
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        # Developer supplies their own signing team.
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic

  BadwaterIgnitionTests:
    type: bundle.unit-test
    supportedDestinations: [iOS]
    sources:
      - path: App/BadwaterIgnitionTests
    dependencies:
      - target: BadwaterIgnition
      - package: BadwaterCore
        product: BadwaterCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.badwater.ignition.unittests
        GENERATE_INFOPLIST_FILE: YES

  BadwaterIgnitionUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS]
    sources:
      - path: App/BadwaterIgnitionUITests
    dependencies:
      - target: BadwaterIgnition
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.badwater.ignition.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  BadwaterIgnition:
    build:
      targets:
        BadwaterIgnition: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BadwaterIgnitionTests
        - BadwaterIgnitionUITests
