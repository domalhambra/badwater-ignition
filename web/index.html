<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moved to ignition.plateworks.org</title>
<meta name="description" content="This app has moved to ignition.plateworks.org.">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0; url=https://ignition.plateworks.org/">
<link rel="canonical" href="https://ignition.plateworks.org/">
<style>
  :root { --ground:#F2F0E9; --ink:#211E17; --muted:#6E6A5D; --teal:#1F6E7A; }
  @media (prefers-color-scheme: dark){
    :root { --ground:#0F0E0B; --ink:#F0ECDF; --muted:#9A9484; --teal:#64B9C3; }
  }
  html,body { height:100%; margin:0; }
  body {
    display:grid; place-items:center; background:var(--ground); color:var(--ink);
    font:17px/1.5 -apple-system,"SF Pro Text",system-ui,"Segoe UI",sans-serif;
    padding:24px; box-sizing:border-box; text-align:center;
  }
  a { color:var(--teal); }
  p.small { color:var(--muted); font-size:14px; }
</style>
</head>
<body>
<main>
  <h1>This app has moved</h1>
  <p>It now lives at <a href="https://ignition.plateworks.org/">ignition.plateworks.org</a>.</p>
  <p class="small">If you had it installed to your home screen, remove the old
  icon and install it again from the new address. Your device does this once;
  after that it works offline as before.</p>
</main>
</body>
</html>
