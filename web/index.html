<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Badwater Obs — field weather observations</title>
<meta name="description" content="Field-fast Probability of Ignition and hourly weather observations from the NWCG IRPG (PMS 461) and belt-weather-kit tables. Works offline. Decision-support only — verify against your IRPG.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F2F0E9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F0E0B" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Obs">
<meta name="robots" content="index,follow">
<style>
  :root {
    --ground:#F2F0E9; --surface:#FFFFFF; --raised:#FAF9F4; --sunk:#EAE8DF;
    --ink:#211E17; --muted:#6E6A5D; --hair:#DDD9CC;
    --teal:#1F6E7A; --tealSunk:#165059; --amber:#9A6A0B;
    --sv0:#5E7250; --sv1:#8A7A2E; --sv2:#B07A1E; --sv3:#BE5F26; --sv4:#B0431F; --sv5:#9E2B1B;
    --chipTint:rgba(31,110,122,0.16);
    --board:#DCD8CC;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --round:-apple-system,"SF Pro Rounded",ui-rounded,system-ui,sans-serif;
    --sans:-apple-system,"SF Pro Text",system-ui,"Segoe UI",sans-serif;
  }
  @media (prefers-color-scheme: dark){ :root{
    --ground:#0F0E0B; --surface:#191712; --raised:#201D16; --sunk:#14120D;
    --ink:#F0ECDF; --muted:#9A9484; --hair:#2A2519;
    --teal:#64B9C3; --tealSunk:#3E8E99; --amber:#E8B84B;
    --sv0:#6E8460; --sv1:#B3A24A; --sv2:#CE9636; --sv3:#D9823C; --sv4:#DD6A30; --sv5:#D6402A;
    --chipTint:rgba(100,185,195,0.18); --board:#0A0908;
  }}
  :root[data-theme="dark"]{
    --ground:#0F0E0B; --surface:#191712; --raised:#201D16; --sunk:#14120D;
    --ink:#F0ECDF; --muted:#9A9484; --hair:#2A2519;
    --teal:#64B9C3; --tealSunk:#3E8E99; --amber:#E8B84B;
    --sv0:#6E8460; --sv1:#B3A24A; --sv2:#CE9636; --sv3:#D9823C; --sv4:#DD6A30; --sv5:#D6402A;
    --chipTint:rgba(100,185,195,0.18); --board:#0A0908;
  }
  :root[data-theme="light"]{
    --ground:#F2F0E9; --surface:#FFFFFF; --raised:#FAF9F4; --sunk:#EAE8DF;
    --ink:#211E17; --muted:#6E6A5D; --hair:#DDD9CC;
    --teal:#1F6E7A; --tealSunk:#165059; --amber:#9A6A0B;
    --sv0:#5E7250; --sv1:#8A7A2E; --sv2:#B07A1E; --sv3:#BE5F26; --sv4:#B0431F; --sv5:#9E2B1B;
    --chipTint:rgba(31,110,122,0.16); --board:#DCD8CC;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{background:var(--board);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 10px;min-height:100%;}
  .hint{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.02em;text-align:center;max-width:420px;}
  .hint b{color:var(--teal);}
  .phone{width:100%;max-width:420px;height:min(86vh,860px);display:flex;flex-direction:column;
    background:var(--ground);border-radius:30px;overflow:hidden;border:1px solid var(--hair);
    box-shadow:0 24px 50px -22px rgba(0,0,0,.55);position:relative;}
  .statusbar{display:flex;justify-content:space-between;align-items:center;padding:8px 18px 4px;
    font-family:var(--mono);font-size:11px;color:var(--muted);flex:0 0 auto;}
  .screen{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;position:relative;}
  .screen::-webkit-scrollbar{width:0;}
  .pad{padding:12px 16px 22px;display:flex;flex-direction:column;gap:16px;}
  .tabbar{flex:0 0 auto;display:flex;background:var(--surface);border-top:1px solid var(--hair);}
  .tab{flex:1;text-align:center;padding:8px 0 12px;font-family:var(--mono);font-size:9px;letter-spacing:.05em;
    text-transform:uppercase;color:var(--muted);cursor:pointer;background:none;border:none;}
  .tab.on{color:var(--teal);}
  .tab .ic{font-size:17px;display:block;margin-bottom:2px;}

  .titlerow{display:flex;justify-content:space-between;align-items:baseline;}
  .title{font-family:var(--round);font-weight:800;font-size:22px;}
  .lbl{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);}

  .sect{display:flex;align-items:baseline;gap:8px;margin-bottom:2px;}
  .sect .st{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);}
  .sect .shared{margin-left:auto;display:flex;gap:4px;align-items:center;font-family:var(--mono);font-size:9px;letter-spacing:.06em;color:var(--muted);}
  .group{display:flex;flex-direction:column;gap:11px;}
  .box{background:var(--sunk);border:1px solid var(--hair);border-radius:16px;padding:12px;}
  .row{display:flex;gap:10px;}
  .row>*{flex:1;min-width:0;}

  .chiprow{display:flex;flex-direction:column;gap:6px;}
  .chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;}
  .chips::-webkit-scrollbar{height:0;}
  .chip{font-family:var(--mono);font-size:10.5px;letter-spacing:.02em;padding:7px 11px;border-radius:999px;
    white-space:nowrap;border:1px solid var(--hair);color:var(--muted);background:var(--surface);cursor:pointer;}
  .chip.on{border:1.5px solid var(--teal);color:var(--teal);background:var(--chipTint);}

  .stepper{background:var(--surface);border:1px solid var(--hair);border-radius:16px;padding:12px 13px;display:flex;flex-direction:column;gap:7px;}
  .stepper.sunkbg{background:var(--surface);}
  .stepper .val{display:flex;align-items:baseline;gap:3px;}
  .stepper .num{font-family:var(--round);font-weight:700;font-size:28px;font-variant-numeric:tabular-nums;}
  .stepper .un{font-size:12px;color:var(--muted);}
  .pm{display:flex;gap:8px;}
  .pm button{flex:1;padding:9px 0;border-radius:10px;background:var(--sunk);color:var(--ink);font-weight:700;font-size:16px;
    border:none;cursor:pointer;min-height:40px;}
  .pm button:active{background:var(--tealSunk);color:#fff;}
  .obsnudge{min-width:46px;min-height:40px;border-radius:10px;background:var(--sunk);border:none;color:var(--ink);font-family:var(--mono);font-weight:700;font-size:11px;cursor:pointer;}
  .obsnudge:active{background:var(--tealSunk);color:#fff;}
  .copypill{position:absolute;top:7px;right:7px;font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.04em;color:var(--teal);background:var(--surface);border:1px solid var(--teal);border-radius:999px;padding:3px 9px;cursor:pointer;}

  .statcard{background:var(--surface);border:1px solid var(--hair);border-radius:16px;padding:12px 13px;}
  .statcard .num{font-family:var(--round);font-weight:700;font-size:26px;font-variant-numeric:tabular-nums;}

  .derived{display:flex;align-items:baseline;justify-content:space-between;background:var(--surface);border:1px solid var(--hair);border-radius:16px;padding:12px 14px;}
  .derived .big{font-family:var(--round);font-weight:800;font-size:30px;color:var(--teal);font-variant-numeric:tabular-nums;}

  .strip{display:flex;align-items:center;gap:8px;min-height:34px;font-family:var(--mono);font-size:10.5px;color:var(--muted);}
  .strip.caution{color:var(--amber);}
  .strip.good{color:var(--teal);}
  .strip button{margin-left:auto;border:1.5px solid currentColor;background:none;color:inherit;border-radius:999px;
    padding:6px 11px;font-family:var(--mono);font-weight:700;font-size:10px;cursor:pointer;}

  .pigbar{position:sticky;top:0;z-index:6;background:color-mix(in srgb,var(--surface) 95%,transparent);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--hair);
    padding:9px 16px;display:flex;flex-direction:column;gap:7px;}
  .wxrow{display:flex;gap:14px;}
  .wxnode{flex:1;display:flex;flex-direction:column;gap:1px;}
  .wxnode .k{font-family:var(--mono);font-size:9px;letter-spacing:.06em;color:var(--muted);}
  .wxnode .v{font-family:var(--round);font-weight:800;font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .wxnode .v small{font-size:10px;color:var(--muted);}
  .pigrow{display:flex;align-items:center;gap:14px;}
  .pnode{display:flex;flex-direction:column;gap:3px;}
  .pnode .rl{display:flex;align-items:baseline;gap:4px;}
  .pnode .rl .k{font-family:var(--mono);font-size:9.5px;color:var(--muted);}
  .pnode .rl .v{font-family:var(--round);font-weight:800;font-size:23px;line-height:1;font-variant-numeric:tabular-nums;}
  .pnode .rl .v small{font-size:13px;}
  .ubar{height:3px;width:48px;border-radius:2px;}
  .beh{margin-left:auto;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.05em;}

  .chain{display:flex;align-items:center;background:var(--sunk);border:1px solid var(--hair);border-radius:12px;padding:9px 10px;font-family:var(--mono);}
  .chain .node{flex:1;text-align:center;}
  .chain .cl{font-size:9px;color:var(--muted);}
  .chain .cv{font-size:11px;font-weight:700;}
  .chain .ar{color:var(--muted);opacity:.5;padding:0 3px;}

  .results{display:flex;gap:10px;align-items:flex-start;}
  .result{flex:1;position:relative;background:var(--surface);border:1px solid var(--hair);border-radius:18px;padding:12px 13px;overflow:hidden;}
  .result .stp{position:absolute;left:0;top:0;bottom:0;width:4px;}
  .result .rk{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);}
  .result .rv{display:flex;align-items:baseline;gap:2px;margin-top:3px;}
  .result .rv .n{font-family:var(--round);font-weight:800;font-size:38px;line-height:1;font-variant-numeric:tabular-nums;}
  .result .rv .p{font-family:var(--round);font-weight:800;font-size:18px;}
  .result .sub{font-family:var(--mono);font-size:9px;color:var(--muted);margin-top:4px;}
  .result .edge{font-family:var(--mono);font-size:9px;color:var(--amber);margin-top:5px;min-height:12px;}

  .interp{background:var(--sunk);border:1px solid var(--hair);border-radius:12px;padding:11px 12px;}
  .interp .top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .interp .dot{width:9px;height:9px;border-radius:999px;}
  .interp .ti{font-weight:600;font-size:14px;}
  .interp .rg{font-family:var(--mono);font-size:9px;color:var(--muted);}
  .interp .de{font-size:12px;color:color-mix(in srgb,var(--ink) 85%,transparent);margin-top:4px;}
  .interp .ca{font-family:var(--mono);font-size:9px;color:var(--muted);font-style:italic;margin-top:5px;}

  .btn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;min-height:48px;
    font-family:var(--round);font-weight:700;font-size:15px;cursor:pointer;border:none;}
  .btn.primary{background:var(--teal);color:#fff;}
  .btn.ghost{background:none;color:var(--teal);border:1.5px solid var(--teal);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btnrow{display:flex;gap:10px;}
  .btnrow>*{flex:1;}

  .disc{font-family:var(--mono);font-size:9px;color:var(--muted);text-align:center;}
  .hero{background:var(--raised);border:1px solid var(--hair);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px;}
  .hero .htop{display:flex;align-items:baseline;gap:8px;}
  .hero .htime{font-family:var(--round);font-weight:800;font-size:22px;}
  .radio{font-family:var(--mono);font-size:9.5px;background:var(--sunk);border:1px solid var(--hair);border-radius:10px;padding:8px 9px;}
  .broadcast{font-size:12px;line-height:1.45;background:var(--sunk);border:1px solid var(--hair);border-radius:12px;padding:11px 12px;}
  .empty{border:1px dashed var(--hair);border-radius:16px;padding:24px 14px;text-align:center;background:var(--raised);}
  .empty .t{font-family:var(--round);font-weight:800;font-size:18px;}
  .logrow{display:flex;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--hair);border-radius:12px;padding:8px 12px;}
  .logrow .lt{font-family:var(--round);font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;}
  .logrow .lp{font-family:var(--mono);font-size:10px;}
  .logrow .lw{font-family:var(--mono);font-size:9px;color:var(--muted);}
  .logrow .edt{margin-left:auto;background:none;border:none;color:var(--teal);font-size:15px;cursor:pointer;width:38px;height:40px;}
  .logrow .del{background:none;border:none;color:var(--amber);font-size:15px;cursor:pointer;width:38px;height:40px;}
  .modalwrap{position:absolute;inset:0;z-index:12;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;}
  .modal{width:100%;max-height:92%;overflow-y:auto;background:var(--ground);border-top-left-radius:20px;border-top-right-radius:20px;
    border-top:1px solid var(--hair);padding:16px;display:flex;flex-direction:column;gap:12px;}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field input,.field textarea{font-family:var(--sans);font-size:13px;color:var(--ink);background:var(--surface);
    border:1px solid var(--hair);border-radius:10px;padding:10px 11px;width:100%;min-height:40px;}
  textarea{resize:none;}
  .spark{background:var(--sunk);border:1px solid var(--hair);border-radius:12px;padding:10px;}
  .toast{position:absolute;left:12px;right:12px;bottom:70px;z-index:9;background:var(--ink);color:var(--ground);
    border-radius:12px;padding:11px 14px;display:flex;align-items:center;gap:10px;font-size:13px;
    box-shadow:0 8px 24px rgba(0,0,0,.35);}
  .toast button{margin-left:auto;background:none;border:none;color:var(--teal);font-weight:700;font-size:13px;cursor:pointer;}
  .logbar{position:sticky;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--hair);padding:10px 16px 12px;}
</style>
<style>
  /* ---- standalone web-app shell (obs.badwater.guide) ---- */
  html,body{height:100%;}
  body{padding:0;gap:0;display:block;background:var(--ground);}
  .phone{
    max-width:520px;width:100%;height:100vh;height:100dvh;margin:0 auto;
    border:none;border-radius:0;box-shadow:none;background:var(--ground);
  }
  .statusbar{padding-top:calc(8px + env(safe-area-inset-top));}
  .logbar{padding-bottom:calc(12px + env(safe-area-inset-bottom));}
  @media (min-width:600px){
    body{background:var(--board);}
    .phone{height:min(940px,96vh);margin:2vh auto;border:1px solid var(--hair);
      border-radius:26px;box-shadow:0 24px 50px -24px rgba(0,0,0,.5);overflow:hidden;}
  }
  @media (display-mode:standalone){ body{background:var(--ground);} }
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar"><span id="clock">--:--</span><span>Badwater · Obs</span><span aria-hidden="true"></span></div>
  <div class="screen" id="screen"></div>
  <div class="toast" id="toast" style="display:none"></div>
  <div class="tabbar" id="tabbar">
    <button class="tab" data-action="tab" data-val="humidity"><span class="ic">💧</span>Humidity</button>
    <button class="tab" data-action="tab" data-val="ignition"><span class="ic">🔥</span>Ignition</button>
    <button class="tab" data-action="tab" data-val="watch"><span class="ic">🔭</span>Obs</button>
  </div>
</div>
<script>
"use strict";
//====================== BadwaterCore port ======================
// Table A — reference fuel moisture (6 temp rows x 21 RH cols)
const REF_GRID=[
 [1,2,2,3,4,5,5,6,7,8,8,8,9,9,10,11,12,12,13,13,14],
 [1,2,2,3,4,5,5,6,7,7,7,8,9,9,10,10,11,12,13,13,13],
 [1,2,2,3,4,5,5,6,6,7,7,8,8,9,9,10,11,12,12,12,13],
 [1,1,2,2,3,4,5,5,6,7,7,8,8,8,9,10,10,11,12,12,13],
 [1,1,2,2,3,4,4,5,6,7,7,8,8,8,9,10,10,11,12,12,13],
 [1,1,2,2,3,4,4,5,6,7,7,8,8,8,9,10,10,11,12,12,12]];
function refTempRow(t){ if(t<30)return 0; if(t<=49)return 1; if(t<=69)return 2; if(t<=89)return 3; if(t<=109)return 4; return 5; }
function refRhCol(rh){ rh=Math.min(100,Math.max(0,rh)); if(rh>=100)return 20; return Math.floor(rh/5); }
function referenceFM(t,rh){ return REF_GRID[refTempRow(t)][refRhCol(rh)]; }

// Tables B/C/D — corrections (unshaded 8 rows, shaded 4 rows; 18 cols)
const CORR={
 B:{u:[[2,3,4,1,1,1,0,0,1,0,0,1,1,1,1,2,3,4],[3,4,4,1,2,2,1,1,2,1,1,2,1,2,2,3,4,4],[2,2,3,1,1,1,0,0,1,0,0,1,1,1,2,3,4,4],[1,2,2,0,0,1,0,0,1,1,1,2,2,3,4,4,5,6],[2,3,3,1,1,1,0,0,1,0,0,1,1,1,1,2,3,3],[2,3,3,1,1,2,0,1,1,0,1,1,1,1,2,2,3,3],[2,3,4,1,1,2,0,0,1,0,0,1,0,1,1,2,3,3],[4,5,6,2,3,4,1,1,2,0,0,1,0,0,1,1,2,2]],
    s:[[4,5,5,3,4,5,3,3,4,3,3,4,3,4,5,4,5,5],[4,4,5,3,4,5,3,3,4,3,4,4,3,4,5,4,5,6],[4,4,5,3,4,5,3,3,4,3,3,4,3,4,5,4,5,5],[4,5,6,3,4,5,3,3,4,3,3,4,3,4,5,4,4,5]]},
 C:{u:[[3,4,5,1,2,3,1,1,2,1,1,2,1,2,3,3,4,5],[3,4,5,3,3,4,2,3,4,2,3,4,3,3,4,3,4,5],[3,4,5,1,2,3,1,1,1,1,1,2,1,2,4,3,4,5],[3,3,4,1,1,1,1,1,1,1,2,3,3,4,5,4,5,6],[3,4,5,1,2,2,1,1,1,1,1,1,1,2,3,3,4,5],[3,4,5,1,2,2,0,1,1,0,1,1,1,2,2,3,4,5],[3,4,5,1,2,3,1,1,1,1,1,1,1,2,3,3,4,5],[4,5,6,3,4,5,1,2,3,1,1,1,1,1,1,3,3,4]],
    s:[[4,5,6,4,5,5,3,4,5,3,4,5,4,5,5,4,5,6],[4,5,6,3,4,5,3,4,5,3,4,5,4,5,6,4,5,6],[4,5,6,3,4,5,3,4,5,3,4,5,3,4,5,4,5,6],[4,5,6,4,5,6,3,4,5,3,4,5,3,4,5,4,5,6]]},
 D:{u:[[4,5,6,3,4,5,2,3,4,2,3,4,3,4,5,4,5,6],[4,5,6,4,5,6,4,5,6,4,5,6,4,5,6,4,5,6],[4,5,6,3,4,4,2,3,3,2,3,3,3,4,5,4,5,6],[4,5,6,2,3,4,2,2,3,3,4,4,4,5,6,4,5,6],[4,5,6,3,4,5,2,3,3,2,2,3,3,4,4,4,5,6],[4,5,6,2,3,3,1,1,2,1,1,2,2,3,3,4,5,6],[4,5,6,3,4,5,2,3,3,2,3,3,3,4,4,4,5,6],[4,5,6,4,5,6,3,4,4,2,2,3,2,3,4,4,5,6]],
    s:[[4,5,6,4,5,6,4,5,6,4,5,6,4,5,6,4,5,6],[4,5,6,4,5,6,4,5,6,4,5,6,4,5,6,4,5,6],[4,5,6,4,5,6,4,5,6,4,5,6,4,5,6,4,5,6],[4,5,6,4,5,6,4,5,6,4,5,6,4,5,6,4,5,6]]}};
const ASPECTS=["N","E","S","W"];
const DELTAS=["below","level","above"];
function correction(group,shaded,aspect,steep,bandIdx,delta){
  const g=CORR[group]; const col=bandIdx*3+DELTAS.indexOf(delta);
  if(shaded){ return g.s[ASPECTS.indexOf(aspect)][col]; }
  return g.u[ASPECTS.indexOf(aspect)*2+(steep?1:0)][col];
}

// PIG table (9 temp rows x 16 FFM cols, FFM 2..17)
const PIG_U=[
 [100,100,80,70,60,60,50,40,40,30,30,20,20,20,20,10],
 [100,90,80,70,60,60,50,40,40,30,30,20,20,20,10,10],

 [100,80,70,60,60,50,40,40,30,30,20,20,20,10,10,10],
 [90,80,70,60,50,50,40,30,30,20,20,20,20,10,10,10],
 [90,80,70,60,50,40,40,30,30,20,20,20,10,10,10,10],
 [90,80,70,60,50,40,40,30,30,20,20,20,10,10,10,10],
 [80,70,60,50,50,40,30,30,20,20,20,10,10,10,10,10]];
const PIG_S=[
 [100,90,80,70,60,50,50,40,40,30,30,20,20,20,10,10],
 [100,90,80,70,60,50,50,40,30,30,30,20,20,20,10,10],
 [100,90,80,70,60,50,40,40,30,30,20,20,20,10,10,10],
 [100,80,70,60,60,50,40,40,30,30,20,20,20,10,10,10],
 [90,80,70,60,50,50,40,30,30,30,20,20,20,10,10,10],
 [90,80,70,60,50,40,40,30,30,20,20,20,10,10,10,10],
 [90,80,70,60,50,40,40,30,30,20,20,20,10,10,10,10],
 [90,80,60,50,50,40,30,30,30,20,20,20,10,10,10,10],
 [80,80,60,50,50,40,30,30,20,20,20,10,10,10,10,10]];
function pigTempRow(t){ if(t>=110)return 0; if(t>=100)return 1; if(t>=90)return 2; if(t>=80)return 3; if(t>=70)return 4; if(t>=60)return 5; if(t>=50)return 6; if(t>=40)return 7; return 8; }
function pigFfmCol(f){ return Math.min(Math.max(f-2,0),15); }
function pig(t,ffm,shaded){ return (shaded?PIG_S:PIG_U)[pigTempRow(t)][pigFfmCol(ffm)]; }

// Fire behavior interpretation
const BEHAV=[
 {t:"Very Low",r:"<10%",d:"Very low ignition, some spotting may occur with wind"},
 {t:"Low",r:"10 to 20%",d:"Low ignition, campfires can be hazardous"},
 {t:"Medium",r:"20 to 30%",d:"Medium ignition, matches hazardous, easy burning"},
 {t:"High",r:"30 to 50%",d:"High ignition, matches dangerous, spotting possible with wind, medium burning conditions"},
 {t:"Very High",r:"50 to 70%",d:"Very high ignition, rapid buildup, extensive spotting and crowning, and loss of control"},
 {t:"Extreme",r:"80 to 100%",d:"Extreme ignition and initial spread, frequent spots, critical fire conditions"}];
const CAUTION="Use these thresholds with caution; consult local experts.";
function behavior(p){ if(p<10)return 0; if(p<20)return 1; if(p<30)return 2; if(p<50)return 3; if(p<80)return 4; return 5; }
function sevVar(b){ return `var(--sv${b})`; }

function monthGroup(m){ if(m===5||m===6||m===7)return"B"; if(m===11||m===12||m===1)return"D"; return"C"; }
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function groupMonths(g){ return g==="B"?"May Jun Jul":g==="D"?"Nov Dec Jan":"Feb Mar Apr Oct"; }
const TIMEBANDS=["0800-0959","1000-1159","1200-1359","1400-1559","1600-1759","1800-1959"];
function timeBandFromClock(h,m){ const x=h*60+m; if(x>=480&&x<600)return 0; if(x<720)return 1; if(x<840)return 2; if(x<960)return 3; if(x<1080)return 4; if(x<1200)return 5; return "night"; }

// Psychrometrics (Bolton + Ferrel sling)
const INHG_HPA=33.86389;
function esat(c){ return 6.112*Math.exp((17.67*c)/(c+243.5)); }
const f2c=f=>(f-32)*5/9, c2f=c=>c*9/5+32;
function psychro(dryF,wetF,pInHg){
  const wet=Math.min(wetF,dryF); const tD=f2c(dryF),tW=f2c(wet); const P=pInHg*INHG_HPA;
  const esD=esat(tD),esW=esat(tW); const k=0.000660*(1+0.00115*tW);
  let vp=esW-k*P*(tD-tW); if(vp<0.01)vp=0.01;
  const rh=Math.max(0,Math.min(100,100*vp/esD));
  const ratio=Math.log(vp/6.112); const dewC=(243.5*ratio)/(17.67-ratio);
  return {rh:Math.round(rh),dew:Math.round(c2f(dewC)),dep:Math.round(dryF-wet)};
}
const BANDS=[{n:1,p:30,l:"0–500 ft"},{n:2,p:29,l:"501–1,900 ft"},{n:3,p:27,l:"1,901–3,900 ft"},{n:4,p:25,l:"3,901–6,100 ft"},{n:5,p:23,l:"6,101–8,500 ft"},{n:6,p:21,l:"8,501–11,000  ft"}];
function bandByNum(n){ return BANDS.find(b=>b.n===n)||BANDS[2]; }
function bandForElev(feet,ak){
  if(ak){ if(feet<301)return 1; if(feet<=1700)return 2; if(feet<=3600)return 3; if(feet<=5700)return 4; if(feet<=7900)return 5; return 6; }
  if(feet<501)return 1; if(feet<=1900)return 2; if(feet<=3900)return 3; if(feet<=6100)return 4; if(feet<=8500)return 5; return 6;
}

// Wind
const DIRNAME={N:"North",E:"East",S:"South",W:"West",NE:"Northeast",SE:"Southeast",SW:"Southwest",NW:"Northwest"};
const DIRS=["N","NE","E","SE","S","SW","W","NW"];
// selectable trend metrics (pct pins 0-100; others auto-fit)
const METRICS=[
  {k:"pigU",label:"PIG (unsh)",pct:true,f:o=>o.pigU},
  {k:"pigS",label:"PIG (shd)",pct:true,f:o=>o.pigS},
  {k:"temp",label:"Temp",pct:false,f:o=>o.temp},
  {k:"rh",label:"RH",pct:true,f:o=>o.rh},
  {k:"ffmU",label:"FFM",pct:false,f:o=>o.ffmU}
];
function windRendered(w){ return w.low===w.high?String(w.high):w.low+"-"+w.high; }
function windSpot(w){ if(w.high<=0)return"Calm"; const d=w.dir?w.dir+" ":""; const g=w.gust>0?" Gust "+w.gust:""; return d+windRendered(w)+g; }
function windSpoken(w){ const g=w.gust>0?", with gusts up to "+w.gust:""; if(w.high<=0)return"light and variable"+g; const unit=(w.low===w.high&&w.low===1)?"mile per hour":"miles per hour"; const d=w.dir?" from the "+DIRNAME[w.dir]:""; return `${windRendered(w)} ${unit}${d}`+g; }
// IMET column E: speed-first, full direction word (e.g. "3-6 Southwest, Gust 12", "Light/Variable")
function windImet(w){ const g=w.gust>0?", Gust "+w.gust:""; if(w.high<=0)return"Light/Variable"+g; const d=w.dir?" "+DIRNAME[w.dir]:""; return windRendered(w)+d+g; }

// Estimate
function effectiveRH(){ return S.rhSource==="direct"?S.relativeHumidity:psychro(S.dryBulbF,S.wetBulbF,bandByNum(S.band).p).rh; }
function estimate(o){
  const rf=referenceFM(o.dryBulbF,o.rh);
  const night=o.timeBand==="night"; const g=monthGroup(o.month);
  function side(shaded){
    let corr=null,ffm;
    if(night){ ffm=rf+5; } else { corr=correction(g,shaded,o.aspect,o.slope==="steep",o.timeBand,o.elevationDelta); ffm=rf+corr; }
    const p=pig(o.dryBulbF,ffm,shaded); return {corr,ffm,pig:p,b:behavior(p)};
  }
  return {rf,night,unshaded:side(false),shaded:side(true)};
}
// simple sensitivity edge: perturb dry bulb ±2 and RH/wet-bulb ±3 — does the band change?
function edge(shaded){
  const base=estimate(coreInputs())[shaded?"shaded":"unshaded"];
  let hi=base.pig, lo=base.pig;
  for(const dt of [-2,2]) for(const dw of [-3,3]){
    const dry=S.dryBulbF+dt; let rh;
    if(S.rhSource==="direct"){ rh=Math.min(100,Math.max(0,S.relativeHumidity+dw)); }
    else { const wet=Math.min(S.wetBulbF+dw,dry); rh=psychro(dry,wet,bandByNum(S.band).p).rh; }
    const e=estimate({dryBulbF:dry,rh,month:S.month,timeBand:S.timeBand,aspect:S.aspect,slope:S.slope,elevationDelta:S.elevationDelta})[shaded?"shaded":"unshaded"];
    hi=Math.max(hi,e.pig); lo=Math.min(lo,e.pig);
  }
  if(behavior(hi)!==base.b) return {dir:"↗",pig:hi};
  if(behavior(lo)!==base.b) return {dir:"↘",pig:lo};
  return null;
}
function coreInputs(){ return {dryBulbF:S.dryBulbF,rh:effectiveRH(),month:S.month,timeBand:S.timeBand,aspect:S.aspect,slope:S.slope,elevationDelta:S.elevationDelta}; }

//====================== Radio script (port) ======================
function renderBroadcast(cur,prev){
  const sent=[];
  const name=(S.addressee||"").trim();
  sent.push(name?`${name}, stand by for your ${hhmm(cur.min)} Weather observation.`:`Stand by for your ${hhmm(cur.min)} Weather observation.`);
  const speak = !prev || prev.elevationFeet!==cur.elevationFeet || prev.aspect!==cur.aspect || prev.slope!==cur.slope || (prev.spokenLocation||"")!==(cur.spokenLocation||"");
  if(speak){
    let s="Taken",detail=false;
    if(cur.spokenLocation){ s+=" "+cur.spokenLocation; detail=true; }
    if(cur.elevationFeet!=null){ s+=` at an elevation of ${grouped(cur.elevationFeet)} feet`; detail=true; }
    const adj={N:"Northern",E:"Eastern",S:"Southern",W:"Western"}[cur.aspect];
    const steep=cur.slope==="steep"; const art=steep?"a":(cur.aspect==="E"?"an":"a");
    const desc=steep?`steep ${adj}`:adj;
    s+= (detail?`, on ${art} ${desc} aspect.`:` on ${art} ${desc} aspect.`);
    sent.push(s);
  }
  const tDelta=prev?delta(cur.temp-prev.temp):""; const rDelta=prev?delta(cur.rh-prev.rh):"";
  const bodyC=`Dry Bulb ${cur.temp} degrees${tDelta}, RH ${cur.rh}%${rDelta}`;
  sent.push(bodyC+".");
  const pigS=`Probability of Ignition Unshaded is ${cur.pigU}%, Shaded is ${cur.pigS}%.`;
  sent.push(cur.wind.speed>0||cur.wind.gust>0?`Winds are ${windSpoken(cur.wind)}, ${pigS}`:pigS);
  sent.push(`I repeat, ${bodyC}.`);
  sent.push("How copy?");
  return sent.join(" ");
}
function delta(d){ if(d===0)return", no change"; return d>0?`, up ${d}`:`, down ${-d}`; }

//====================== IMET .xlsx (store-only zip, ported from BadwaterCore) ======================
const CRC_TABLE=(()=>{ const t=new Uint32Array(256); for(let i=0;i<256;i++){ let c=i; for(let k=0;k<8;k++){ c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1); } t[i]=c>>>0; } return t; })();
function crc32(bytes){ let c=0xFFFFFFFF; for(let i=0;i<bytes.length;i++){ c=CRC_TABLE[(c^bytes[i])&0xFF]^(c>>>8); } return (c^0xFFFFFFFF)>>>0; }
function le16(v){ return [v&0xFF,(v>>>8)&0xFF]; }
function le32(v){ return [v&0xFF,(v>>>8)&0xFF,(v>>>16)&0xFF,(v>>>24)&0xFF]; }
function zipStore(entries){
  const enc=new TextEncoder(); const out=[]; const central=[]; const dosTime=0,dosDate=0x21;
  for(const e of entries){
    const name=Array.from(enc.encode(e.path)); const bytes=Array.from(e.bytes);
    const crc=crc32(e.bytes); const size=bytes.length; const offset=out.length;
    out.push(...le32(0x04034b50),...le16(20),...le16(0),...le16(0),...le16(dosTime),...le16(dosDate),
      ...le32(crc),...le32(size),...le32(size),...le16(name.length),...le16(0),...name,...bytes);
    central.push(...le32(0x02014b50),...le16(20),...le16(20),...le16(0),...le16(0),...le16(dosTime),...le16(dosDate),
      ...le32(crc),...le32(size),...le32(size),...le16(name.length),...le16(0),...le16(0),...le16(0),...le16(0),
      ...le32(0),...le32(offset),...name);
  }
  const cdOffset=out.length,cdSize=central.length;
  const eocd=[...le32(0x06054b50),...le16(0),...le16(0),...le16(entries.length),...le16(entries.length),
    ...le32(cdSize),...le32(cdOffset),...le16(0)];
  return new Uint8Array([...out,...central,...eocd]);
}
function buildXlsx(){
  const enc=new TextEncoder();
  const H='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
  const headers=["Time","Dry Bulb","Wet Bulb","RH (%)","Wind (MPH)","Probability of Ignition (Unshaded) (%)","Probability of Ignition (Shaded) (%)","Elevation","Aspect","Location","Notes"];
  const disclaimer="Probability of Ignition = IRPG value, app-computed (not observed, not a forecast). Logged with Badwater Ignition - decision-support only, not affiliated with NWS/NWCG.";
  const rows=S.obs.slice().sort((a,b)=>a.min-b.min);
  const col=i=>String.fromCharCode(65+i);
  const numC=(r,v)=>`<c r="${r}"><v>${v}</v></c>`;
  const strC=(r,v)=>`<c r="${r}" t="inlineStr"><is><t xml:space="preserve">${esc(v)}</t></is></c>`;
  const d=new Date(); const dateStr=`${d.getMonth()+1}/${d.getDate()}/${d.getFullYear()%100}`;
  const tail=[S.division,S.locationName].filter(Boolean).join(", ");
  const title=`${dateStr} Weather Observations`+(tail?` - ${tail}`:"");
  let sd=`<row r="1">${strC("A1",title)}</row><row r="2">`;
  headers.forEach((h,i)=>sd+=strC(col(i)+"2",h)); sd+="</row>";
  rows.forEach((o,ri)=>{ const R=ri+3;
    let c=`<c r="A${R}" s="1"><v>${o.min/1440}</v></c>`+numC("B"+R,o.temp)+numC("D"+R,o.rh);
    if(o.wind.high>0||o.wind.gust>0) c+=strC("E"+R,windImet(o.wind));
    c+=numC("F"+R,o.pigU)+numC("G"+R,o.pigS);
    if(o.elevationFeet!=null) c+=numC("H"+R,o.elevationFeet);
    c+=strC("I"+R,DIRNAME[o.aspect]||o.aspect);
    if(S.coordLat&&S.coordLon) c+=strC("J"+R,`${S.coordLat}, ${S.coordLon}`);
    if(o.note) c+=strC("K"+R,o.note);
    sd+=`<row r="${R}">${c}</row>`;
  });
  const footRow=rows.length+4;
  sd+=`<row r="${footRow}">${strC("A"+footRow,disclaimer)}</row>`;
  const sheet=H+`<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><dimension ref="A1:K${footRow}"/><sheetData>${sd}</sheetData></worksheet>`;
  const parts=[
    {path:"[Content_Types].xml",bytes:enc.encode(H+`<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>`)},
    {path:"_rels/.rels",bytes:enc.encode(H+`<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`)},
    {path:"xl/workbook.xml",bytes:enc.encode(H+`<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Obs" sheetId="1" r:id="rId1"/></sheets></workbook>`)},
    {path:"xl/_rels/workbook.xml.rels",bytes:enc.encode(H+`<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`)},
    {path:"xl/styles.xml",bytes:enc.encode(H+`<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="1"><font><sz val="11"/><name val="Calibri"/></font></fonts><fills count="1"><fill><patternFill patternType="none"/></fill></fills><borders count="1"><border/></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="20" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`)},
    {path:"xl/worksheets/sheet1.xml",bytes:enc.encode(sheet)},
  ];
  return zipStore(parts);
}
function downloadXlsx(){
  try{
    const bytes=buildXlsx();
    const blob=new Blob([bytes],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a"); a.href=url; a.download="BadwaterIgnition-shift.xlsx";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
    toast("Downloaded BadwaterIgnition-shift.xlsx");
  }catch(e){ toast("Download blocked in this frame — open the artifact full-page"); }
}

//====================== Actions ======================
function logObs(){
  const tb=timeBandFromClock(Math.floor(S.pendingMin/60),S.pendingMin%60);
  const e=estimate({dryBulbF:S.dryBulbF,rh:effectiveRH(),month:S.month,timeBand:tb,aspect:S.aspect,slope:S.slope,elevationDelta:S.elevationDelta});
  const prev=S.obs.slice().sort((a,b)=>a.min-b.min).filter(o=>o.min<S.pendingMin).pop()||null;
  const o={id:obsSeq++,min:S.pendingMin,temp:S.dryBulbF,rh:effectiveRH(),pigU:e.unshaded.pig,pigS:e.shaded.pig,ffmU:e.unshaded.ffm,ffmS:e.shaded.ffm,bu:e.unshaded.b,bs:e.shaded.b,
    wind:Object.assign({},S.wind),note:S.note.trim(),month:S.month,elevationDelta:S.elevationDelta,elevationFeet:S.siteElevationFeet,aspect:S.aspect,slope:S.slope,spokenLocation:S.locationName.trim()};
  o.broadcast=renderBroadcast(o,prev);
  S.obs.push(o); S.note=""; S.undo=false;
  S.pendingMin=(o.min+60)%1440;   // pre-fill the next hourly slot
  render();
}
// Correct a logged obs in place — recompute PIG against its OWN frozen month /
// elevation-delta / site factors, and re-render its broadcast against its
// chronological predecessor. Neighboring obs keep the script they broadcast.
function editSave(){
  const o=S.obs.find(x=>x.id===S.editing); const ed=S.edit;
  if(!o||!ed){ S.editing=null; S.edit=null; render(); return; }
  const tb=timeBandFromClock(Math.floor(ed.min/60),ed.min%60);
  const e=estimate({dryBulbF:ed.temp,rh:ed.rh,month:o.month??S.month,timeBand:tb,
    aspect:o.aspect,slope:o.slope,elevationDelta:o.elevationDelta??S.elevationDelta});
  o.min=ed.min; o.temp=ed.temp; o.rh=ed.rh; o.wind=Object.assign({},ed.wind); o.note=(ed.note||"").trim();
  o.pigU=e.unshaded.pig; o.pigS=e.shaded.pig; o.ffmU=e.unshaded.ffm; o.ffmS=e.shaded.ffm; o.bu=e.unshaded.b; o.bs=e.shaded.b;
  const prev=S.obs.slice().sort((a,b)=>a.min-b.min).filter(x=>x.min<o.min&&x.id!==o.id).pop()||null;
  o.broadcast=renderBroadcast(o,prev);
  S.editing=null; S.edit=null; render(); toast("Observation updated");
}

  const a=b.dataset.action;
  if(a==="tab"){ S.tab=b.dataset.val; scr().scrollTop=0; render(); }
  else if(a==="set"){ const f=b.dataset.field,v=b.dataset.val;
    if(f==="windDir"){ S.wind.dir=v; }
    else if(f==="editDir"){ if(S.edit)S.edit.wind.dir=v; }
    else if(f==="timeBand"){ S.timeBand = v==="night"?"night":parseInt(v,10); S.clockOverridden=true; }
    else if(f==="month"){ S.month=parseInt(v,10); S.clockOverridden=true; }
    else if(f==="band"||f==="hBand"){ S[f]=parseInt(v,10); }
    else { S[f]=v; }
    render();
  }
  else if(a==="step"){ const f=b.dataset.field,d=parseInt(b.dataset.d,10),mn=parseInt(b.dataset.min,10),mx=parseInt(b.dataset.max,10);
    if(f==="windLow"){ S.wind.low=Math.min(mx,Math.max(mn,S.wind.low+d)); if(S.wind.low>S.wind.high)S.wind.high=S.wind.low; }
    else if(f==="windHigh"){ S.wind.high=Math.min(mx,Math.max(mn,S.wind.high+d)); if(S.wind.high<S.wind.low)S.wind.low=S.wind.high; }
    else if(f==="windGust"){ S.wind.gust=Math.min(mx,Math.max(mn,S.wind.gust+d)); }
    else if(f==="editTemp"){ if(S.edit){ S.edit.temp=Math.min(mx,Math.max(mn,S.edit.temp+d)); } }
    else if(f==="editRh"){ if(S.edit){ S.edit.rh=Math.min(mx,Math.max(mn,S.edit.rh+d)); } }
    else if(f==="editWindLow"){ if(S.edit){ S.edit.wind.low=Math.min(mx,Math.max(mn,S.edit.wind.low+d)); if(S.edit.wind.low>S.edit.wind.high)S.edit.wind.high=S.edit.wind.low; } }
    else if(f==="editWindHigh"){ if(S.edit){ S.edit.wind.high=Math.min(mx,Math.max(mn,S.edit.wind.high+d)); if(S.edit.wind.high<S.edit.wind.low)S.edit.wind.low=S.edit.wind.high; } }
    else if(f==="editGust"){ if(S.edit){ S.edit.wind.gust=Math.min(mx,Math.max(mn,S.edit.wind.gust+d)); } }
    else if(f==="pendingHour"){ S.pendingMin=Math.min(23*60+ S.pendingMin%60, Math.max(0, S.pendingMin + d*60)); }
    else if(f==="pendingMinute"){ const h=Math.floor(S.pendingMin/60); let m=S.pendingMin%60+d; m=Math.min(55,Math.max(0,m)); S.pendingMin=h*60+m; }
    else if(f.startsWith("h")){ stepH(f,d,mn,mx); return; }
    else { stepField(f,d,mn,mx); return; }
    render();
  }
  else if(a==="resumeClock"){ S.clockOverridden=false; const d=new Date(); S.month=d.getMonth()+1; S.timeBand=timeBandFromClock(d.getHours(),d.getMinutes()); render(); }
  else if(a==="useInIgnition"){ const band=bandByNum(S.hBand); const r=psychro(S.hDry,S.hWet,band.p);
    S.rhSource="direct"; S.relativeHumidity=r.rh; S.tab="ignition"; scr().scrollTop=0; render(); toast("RH "+r.rh+"% → Ignition"); }
  else if(a==="obsNudge"){ S.pendingMin=Math.min(1439,Math.max(0,S.pendingMin+parseInt(b.dataset.d,10))); render(); }
  else if(a==="setTrend"){ S.trendMetric=b.dataset.k; render(); }
  else if(a==="confirmSite"){ S.siteConfirmed=true; render(); }
  else if(a==="logObs"){ logObs(); }
  else if(a==="deleteObs"){ const id=parseInt(b.dataset.id,10); const i=S.obs.findIndex(o=>o.id===id); if(i>=0){ S.lastRemoved=S.obs[i]; S.obs.splice(i,1); S.undo=true; } render(); }
  else if(a==="editObs"){ const id=parseInt(b.dataset.id,10); const o=S.obs.find(x=>x.id===id);
    if(o){ S.editing=id; S.edit={origMin:o.min,min:o.min,temp:o.temp,rh:o.rh,wind:Object.assign({low:0,high:0,dir:"N",gust:0},o.wind),note:o.note||""}; } render(); }
  else if(a==="editCancel"){ S.editing=null; S.edit=null; render(); }
  else if(a==="editNudge"){ if(S.edit){ S.edit.min=Math.min(1439,Math.max(0,S.edit.min+parseInt(b.dataset.d,10))); } render(); }
  else if(a==="editSave"){ editSave(); }
  else if(a==="undo"){ if(S.lastRemoved){ S.obs.push(S.lastRemoved); S.lastRemoved=null; S.undo=false; } render(); }
  else if(a==="newShift"){ S.obs=[]; S.siteConfirmed=false; S.lastRemoved=null; S.undo=false; render(); }
  else if(a==="exportXlsx"){ downloadXlsx(); }
  else if(a==="copy"){ const k=b.dataset.kind; const latest=S.obs.slice().sort((x,y)=>y.min-x.min)[0];
    copyText(k==="broadcast"?(latest?latest.broadcast:""):k==="spot"?spotText():notesText()); }
});
// parse "HH:MM" / "HHMM" / "H" -> minutes-of-day, or null while half-typed
function parseHM(s){ const c=(s||"").replace(/[^0-9:]/g,""); let h,m;
  if(c.includes(":")){ const p=c.split(":"); h=parseInt(p[0]||"0",10); m=parseInt(p[1]||"0",10); }
  else { const d=c.replace(/[^0-9]/g,""); if(!d)return null; if(d.length<=2){h=parseInt(d,10);m=0;} else {h=parseInt(d.slice(0,-2),10);m=parseInt(d.slice(-2),10);} }
  if(isNaN(h)||isNaN(m)||h<0||h>23||m<0||m>59)return null; return h*60+m; }
// text inputs — update state without re-render (preserve caret/focus)
document.addEventListener("input",ev=>{
  const el=ev.target; const f=el.dataset&&el.dataset.field; if(!f)return;
  if(f==="obsTime"){ const p=parseHM(el.value); if(p!=null)S.pendingMin=p; return; }
  if(f==="editTime"){ if(S.edit){ const p=parseHM(el.value); if(p!=null)S.edit.min=p; } return; }
  if(f==="editNote"){ if(S.edit)S.edit.note=el.value; return; }
  if(f==="siteElevationFeet"){ const n=parseInt(el.value,10); S.siteElevationFeet=Number.isFinite(n)?n:null; return; }
  S[f]=el.value;
});
// commit the typed obs time (refresh the live PIG preview) on blur/enter
document.addEventListener("change",ev=>{ if(ev.target.dataset&&ev.target.dataset.field==="obsTime")render(); });
document.getElementById("clock").textContent=clockLabel(now.getHours()*60+now.getMinutes());
// Capture typed-but-not-yet-rendered edits when the app is backgrounded/closed.
window.addEventListener("pagehide", saveState);
document.addEventListener("visibilitychange", function(){ if(document.visibilityState==="hidden") saveState(); });
// live "next obs due" countdown — re-render the Obs tab every 30s unless typing
setInterval(()=>{ if(S.tab==="watch" && !(document.activeElement&&["INPUT","TEXTAREA"].includes(document.activeElement.tagName))) render(); },30000);
render();
</script>
