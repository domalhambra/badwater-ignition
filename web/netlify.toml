# Netlify configuration for ignition.badwater.guide.
#
# The site is fully static (a single self-contained page + PWA assets) — there is
# no build step. When connecting this repo to Netlify, set the site's
# "Base directory" to  web/  so this file and `publish = "."` resolve to this
# folder. (Dragging-and-dropping the web/ folder onto Netlify works too.)

[build]
  publish = "."

# The app was formerly branded/served as obs.badwater.guide. That host is kept
# as a domain alias on the Netlify site so this 301 fires, sending any old
# links/bookmarks to the canonical ignition.badwater.guide.
[[redirects]]
  from = "https://obs.badwater.guide/*"
  to = "https://ignition.badwater.guide/:splat"
  status = 301
  force = true

# Security + privacy headers. The app makes no third-party or outbound requests;
# everything (IRPG tables, psychrometrics, .xlsx export) runs locally in-page.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'"

# Always revalidate the entry point and the service worker so updates ship fast.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/engine.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"

# Content-addressed art can cache hard.
[[headers]]
  for = "/icon-512.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icon.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
